<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Krakatoa — Celulares, Notebooks & Audio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0a;
      --surface: #141414;
      --surface2: #1c1c1c;
      --border: rgba(255,255,255,0.07);
      --border2: rgba(255,255,255,0.14);
      --text: #f0ede8;
      --muted: #777;
      --accent: #e8632a;
    }

    body { background: var(--bg); font-family: 'DM Sans', sans-serif; color: var(--text); min-height: 100vh; }

    .wrap { max-width: 1200px; margin: 0 auto; padding: 0 24px 80px; }

    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 32px 0 40px; border-bottom: 0.5px solid var(--border); margin-bottom: 36px;
    }

    .logo {
      font-family: 'Syne', sans-serif; font-size: 28px; font-weight: 800;
      letter-spacing: -0.5px; display: flex; align-items: center; gap: 10px;
    }

    .logo-dot {
      width: 9px; height: 9px; background: var(--accent);
      border-radius: 50%; animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.65); }
    }

    .hright { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 7px; }
    .sdot { width: 6px; height: 6px; border-radius: 50%; background: #3ecf8e; }

    .cat-nav { display: flex; gap: 6px; margin-bottom: 28px; flex-wrap: wrap; }

    .cat-btn {
      font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500;
      padding: 10px 22px; border-radius: 10px; border: 0.5px solid var(--border);
      background: transparent; color: var(--muted); cursor: pointer;
      transition: all 0.18s ease; display: flex; align-items: center; gap: 8px;
    }

    .cat-btn svg { width: 16px; height: 16px; opacity: 0.6; transition: opacity 0.18s; }
    .cat-btn:hover { border-color: var(--border2); color: var(--text); }
    .cat-btn:hover svg { opacity: 1; }
    .cat-btn.active { background: var(--surface2); border-color: var(--border2); color: var(--text); }
    .cat-btn.active svg { opacity: 1; }
    .cat-btn.active .cdot { background: var(--accent); }
    .cdot { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); transition: background 0.18s; }

    .brand-bar { display: flex; gap: 6px; margin-bottom: 20px; flex-wrap: wrap; align-items: center; }
    .brand-label { font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); margin-right: 4px; }

    .brand-btn {
      font-family: 'DM Sans', sans-serif; font-size: 12px; padding: 5px 14px;
      border-radius: 100px; border: 0.5px solid var(--border); background: transparent;
      color: var(--muted); cursor: pointer; transition: all 0.15s ease;
    }

    .brand-btn:hover { border-color: var(--border2); color: var(--text); }
    .brand-btn.active { border-color: var(--accent); color: var(--accent); background: rgba(232,99,42,0.08); }

    .count-bar { font-size: 12px; color: var(--muted); margin-bottom: 18px; }
    .count-bar strong { color: var(--text); }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 16px; }

    .card {
      background: var(--surface); border: 0.5px solid var(--border);
      border-radius: 18px; overflow: hidden; transition: all 0.22s ease;
      display: flex; flex-direction: column;
    }

    .card:hover { border-color: var(--border2); transform: translateY(-4px); background: var(--surface2); }

    .cimg {
      background: #181818; height: 186px; display: flex;
      align-items: center; justify-content: center; padding: 24px; position: relative;
    }

    .cimg img {
      width: 100%; height: 100%; object-fit: contain;
      filter: drop-shadow(0 6px 20px rgba(0,0,0,0.5));
      transition: transform 0.3s ease;
    }

    .card:hover .cimg img { transform: scale(1.06); }

    .badge-off {
      position: absolute; top: 11px; right: 11px;
      background: var(--accent); color: #fff; font-size: 10px; font-weight: 700;
      padding: 3px 10px; border-radius: 100px; font-family: 'Syne', sans-serif;
    }

    .badge-brand {
      position: absolute; top: 11px; left: 11px;
      background: rgba(255,255,255,0.05); border: 0.5px solid rgba(255,255,255,0.1);
      color: var(--muted); font-size: 9px; font-weight: 500; padding: 3px 9px;
      border-radius: 100px; text-transform: uppercase; letter-spacing: 1px;
    }

    .badge-storage {
      position: absolute; bottom: 11px; left: 11px;
      background: rgba(255,255,255,0.05); border: 0.5px solid var(--border);
      color: var(--muted); font-size: 9px; padding: 3px 8px; border-radius: 6px;
    }

    .cbody { padding: 14px 16px 16px; flex: 1; display: flex; flex-direction: column; }

    .cname { font-family: 'Syne', sans-serif; font-size: 14px; font-weight: 700; color: var(--text); margin-bottom: 9px; line-height: 1.3; }

    .cspecs { list-style: none; margin-bottom: 14px; flex: 1; }

    .cspecs li {
      font-size: 11px; color: var(--muted); padding: 3px 0;
      display: flex; align-items: center; gap: 6px;
      border-bottom: 0.5px solid rgba(255,255,255,0.04);
    }

    .cspecs li:last-child { border-bottom: none; }

    .cspecs li::before {
      content: ''; width: 3px; height: 3px;
      border-radius: 50%; background: var(--accent); flex-shrink: 0;
    }

    .cfooter {
      display: flex; align-items: flex-end; justify-content: space-between;
      padding-top: 12px; border-top: 0.5px solid var(--border);
    }

    .price-old { font-size: 11px; color: var(--muted); text-decoration: line-through; margin-bottom: 2px; }

    .price-new { font-family: 'Syne', sans-serif; font-size: 20px; font-weight: 700; color: var(--text); }
    .price-new span { font-size: 12px; font-weight: 400; color: var(--muted); }

    .btn-wa {
      width: 34px; height: 34px; border-radius: 9px;
      background: rgba(37,211,102,0.1); border: 0.5px solid rgba(37,211,102,0.2);
      display: flex; align-items: center; justify-content: center;
      text-decoration: none; transition: all 0.18s ease; flex-shrink: 0;
    }

    .btn-wa:hover { background: rgba(37,211,102,0.22); border-color: rgba(37,211,102,0.45); }
    .btn-wa svg { width: 16px; height: 16px; fill: #25D366; }

    .loading { text-align: center; padding: 80px 0; color: var(--muted); font-size: 14px; }
    .empty { grid-column: 1/-1; text-align: center; padding: 60px 0; color: var(--muted); font-size: 14px; }

    @media (max-width: 600px) {
      .logo { font-size: 22px; }
      .grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
      .cimg { height: 150px; }
    }
  </style>
</head>
<body>

<div class="wrap">

  <header>
    <div class="logo">
      <div class="logo-dot"></div>
      KRAKATOA
    </div>
    <div class="hright">
      <div class="sdot"></div>
      Catálogo actualizado
    </div>
  </header>

  <nav class="cat-nav">
    <button class="cat-btn active" onclick="setCategory('celulares', this)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="5" y="2" width="14" height="20" rx="2"/><circle cx="12" cy="17" r="1"/></svg>
      Celulares <div class="cdot"></div>
    </button>
    <button class="cat-btn" onclick="setCategory('notebooks', this)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="4" width="20" height="14" rx="2"/><path d="M1 20h22"/></svg>
      Notebooks <div class="cdot"></div>
    </button>
    <button class="cat-btn" onclick="setCategory('audio', this)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
      Audio <div class="cdot"></div>
    </button>
  </nav>

  <div class="brand-bar" id="brand-bar"></div>
  <div class="count-bar" id="count-bar"></div>
  <div id="grid-wrap">
    <div class="loading">Cargando productos...</div>
  </div>

</div>

<script>
  // ─── CONFIGURACIÓN ───────────────────────────────────────────
  // Reemplazá con el número de WhatsApp del local (549 + código sin 0 + número)
  const WA_NUMBER = "549XXXXXXXXXX";

  // ─── ESTADO ──────────────────────────────────────────────────
  let allProducts = [];
  let currentCat = "celulares";
  let currentBrand = "Todos";

  // ─── CARGA DESDE JSON ────────────────────────────────────────
  fetch("productos.json")
    .then(r => r.json())
    .then(data => {
      allProducts = data;
      renderBrands();
      renderGrid();
    })
    .catch(() => {
      document.getElementById("grid-wrap").innerHTML =
        '<p style="color:var(--muted);padding:40px;text-align:center">No se pudo cargar el catálogo. Verificá que productos.json esté en la misma carpeta.</p>';
    });

  // ─── MARCAS DINÁMICAS ────────────────────────────────────────
  function renderBrands() {
    const brands = ["Todos", ...new Set(
      allProducts.filter(p => p.cat === currentCat).map(p => p.brand)
    )];
    document.getElementById("brand-bar").innerHTML =
      `<span class="brand-label">Marca</span>` +
      brands.map(b =>
        `<button class="brand-btn${b === currentBrand ? ' active' : ''}" onclick="setBrand('${b}', this)">${b}</button>`
      ).join('');
  }

  // ─── GRID DE CARDS ───────────────────────────────────────────
  function renderGrid() {
    const list = allProducts.filter(p => {
      if (p.cat !== currentCat) return false;
      if (currentBrand !== "Todos" && p.brand !== currentBrand) return false;
      return true;
    });

    document.getElementById("count-bar").innerHTML =
      `<strong>${list.length}</strong> producto${list.length !== 1 ? 's' : ''}`;

    if (!list.length) {
      document.getElementById("grid-wrap").innerHTML =
        '<div class="grid"><div class="empty">No hay productos en esta categoría todavía.</div></div>';
      return;
    }

    document.getElementById("grid-wrap").innerHTML =
      `<div class="grid">${list.map(p => `
        <div class="card">
          <div class="cimg">
            <img src="${p.img}" alt="${p.name}" loading="lazy" onerror="this.style.opacity='.15'">
            ${p.off     ? `<div class="badge-off">-${p.off}%</div>` : ''}
            <div class="badge-brand">${p.brand}</div>
            ${p.storage ? `<div class="badge-storage">${p.storage}</div>` : ''}
          </div>
          <div class="cbody">
            <div class="cname">${p.name}</div>
            <ul class="cspecs">
              ${p.specs.map(s => `<li>${s}</li>`).join('')}
            </ul>
            <div class="cfooter">
              <div>
                ${p.oldPrice ? `<div class="price-old">US$ ${p.oldPrice}</div>` : ''}
                <div class="price-new"><span>US$ </span>${p.price}</div>
              </div>
              <a href="https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(`Hola! Me interesa el ${p.name} a US$ ${p.price}. ¿Está disponible?`)}"
                 target="_blank" class="btn-wa" title="Consultar por WhatsApp">
                <svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
              </a>
            </div>
          </div>
        </div>
      `).join('')}</div>`;
  }

  // ─── NAVEGACIÓN ──────────────────────────────────────────────
  function setCategory(cat, btn) {
    currentCat = cat;
    currentBrand = "Todos";
    document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderBrands();
    renderGrid();
  }

  function setBrand(brand, btn) {
    currentBrand = brand;
    document.querySelectorAll('.brand-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderGrid();
  }
</script>

</body>
</html>
